<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>Ticket Booking</title>
</head>

<body>
<!-- Error 1: Corrected DOCTYPE declaration -->

<!-- Header Section -->
<div id="header">
<h1>Ticket <span>Your Campus Cinema</span></h1>
</div>

<!-- Content Section -->
<div id="content">

<h2>Book Your Tickets</h2>
<p>Promotion: Tickets &lt; RM10 for students &amp; staff!</p>

<!-- Error 2: Corrected form calculation -->

<form action="booking.php" oninput="total.value =
 Number(adult.value) + Number(child.value)">

<!-- Error 3: Corrected name input -->

<label for="name">Name:</label>
<input type="text" id="name" name="name" placeholder="Enter your name" required autofocus> <br>

<!-- Error 4: Corrected email input -->

<label for="email">E-mail:</label>
<input type="email" id="email" name="email" required><br>

<!-- Error 5: Corrected date input -->

<label for="date">Show date:</label>
<input type="date" id="date" name="date"><br>

<!-- Error 6: Corrected movie datalist -->

<label for="movie">Movie:</label>
<input id="movie" name="movie" list="movies">

<datalist id="movies">
 <option value="Space Rangers">
 <option value="Kampung Comedy">
</datalist><br>

<!-- Error 7: Corrected adult ticket input -->

<label for="adult">Adult tickets:</label>
<input type="number" id="adult" name="adult" min="0" value="0"> <br>

<!-- Error 8: Corrected child ticket input -->

<label for="child">Child tickets:</label>
<input type="number" id="child" name="child" min="0" value="0"> <br>

<!-- Error 9: Corrected rating slider -->

<label for="rating">Rate our service:</label>
<input type="range" id="rating" name="rating" min="1" max="5" step="1"> <br>

<!-- Error 10: Corrected output -->

<label for="total">Total tickets:</label>
<output id="total" name="total"
for="adult child">0</output> <br>

<input type="submit" value="Book Now">

</form>
</div>
