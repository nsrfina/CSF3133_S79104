<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors Game</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <!-- Player Section -->
    <section>
        <label>Your Name:</label>
        <input type="text" id="playerName">

        <button onclick="startGame()">Start Game</button>

        <p id="welcome"></p>
    </section>

    <!-- Game Section -->
    <section>
        <h2>Choose Your Move</h2>

        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>

        <br><br>

        <img id="playerImg" src="rock.png" alt="Player">
        <img id="computerImg" src="rock.png" alt="Computer">
    </section>

    <!-- Result Section -->
    <section>
        <h2>Result</h2>

        <p id="result"></p>

        <p>
            Wins:
            <span id="wins" class="winCount">0</span>
            |

            Losses:
            <span id="losses" class="lossCount">0</span>
            |

            Draws:
            <span id="draws" class="drawCount">0</span>
        </p>
    </section>

    <!-- History Section -->
    <section>
        <h2>History</h2>

        <table id="history">
            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>
        </table>
    </section>

    <!-- Buttons -->
    <section>
        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
    </section>

    <!-- Footer -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; Computer Science Club</p>
    </footer>

    <!-- JavaScript File -->
    <script src="game.js"></script>

</body>
</html>
