<!DOCTYPE html>
<html lang="en">
<!-- Error 1: list-style-type:no → list-style-type:none -->
<!-- Error 2: h1 text-decoration:overlined → overline -->
<!-- Error 3: font-weigth → font-weight -->
<!-- Error 4: menu selector → #menu -->
<!-- Error 5: <ui> → <ul> -->
<!-- Error 6: </ui> → </ul> -->
<!-- Error 7: href="menu" → href="#menu" -->
<!-- Error 8: href="video" → href="#video" -->
<!-- Error 9: href="contact" → href="#contact" -->
<!-- Error 10: type="mp4" → type="video/mp4" -->
<head>
    <meta charset="utf-8">

    <!-- Added viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>e-Café Campus</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="cafe.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>e-Café Campus</h1>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#video">Video</a></li>
            <li><a href="#feedback">Feedback</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Menu Section -->
    <section id="menu">

        <h2>Today's Menu</h2>

        <p>
            Freshly brewed coffee and local delights every day.
        </p>

        <article class="item">
            <h3>Kopi Tarik</h3>
            <p>
                Only
                <span class="old-price">RM 4.50</span>
                <span class="highlight">RM 3.50</span>
            </p>
        </article>

        <article class="item">
            <h3>Nasi Lemak</h3>
            <p>
                Only
                <span class="old-price">RM 6.00</span>
                <span class="highlight">RM 5.00</span>
            </p>
        </article>

    </section>

    <!-- Video Section -->
    <section id="video">

        <h2>Watch Our Story</h2>

        <figure>
            <video controls>
                <source src="cafe.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <figcaption>
                Enjoy delicious food and a welcoming atmosphere at e-Café Campus.
            </figcaption>
        </figure>

    </section>

    <!-- Feedback Form -->
    <section id="feedback">

        <h2>Feedback Form</h2>

        <form class="feedback-form">

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label>Visit Type:</label><br>

            <input type="radio" id="dinein" name="visit" value="Dine-In">
            <label for="dinein">Dine-In</label>

            <input type="radio" id="takeaway" name="visit" value="Take-away">
            <label for="takeaway">Take-away</label>

            <br><br>

            <label>Favourite Items:</label><br>

            <input type="checkbox" id="kopi" name="favitem" value="Kopi Tarik">
            <label for="kopi">Kopi Tarik</label>

            <input type="checkbox" id="nasilemak" name="favitem" value="Nasi Lemak">
            <label for="nasilemak">Nasi Lemak</label>

            <input type="checkbox" id="sandwich" name="favitem" value="Sandwich">
            <label for="sandwich">Sandwich</label>

            <br><br>

            <input type="submit" value="Submit">

        </form>

    </section>

    <!-- Footer -->
    <footer id="contact">

        <p>&copy; 2026 e-Café Campus</p>

        <address>
            Email:
            <a href="mailto:ecafe@umt.edu.my">ecafe@umt.edu.my</a>
        </address>

    </footer>

</body>

</html>
